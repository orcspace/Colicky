name: Recover source and verify Windows build
on:
  push:
    branches: [main]
    paths: ['scripts/**', '.github/workflows/recover.yml', 'Source/**', 'tests/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: recovery-main
  cancel-in-progress: true
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      source_sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recover unpacked source and resources
        shell: bash
        run: |
          dotnet tool install ilspycmd --version 9.1.0.7988 --tool-path .cache/fallback-tools
          if [ ! -d Source ]; then
            dotnet tool install ilspycmd --version 11.2.0.10050 --tool-path .cache/tools
            python scripts/recover.py --decompiler "$PWD/.cache/tools/ilspycmd" --fallback-decompiler "$PWD/.cache/fallback-tools/ilspycmd"
          else
            python scripts/recover.py --fill-missing --fallback-decompiler "$PWD/.cache/fallback-tools/ilspycmd"
          fi
          python scripts/generate-index.py
      - name: Commit unpacked project
        id: commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Source Assets BundledResources ClickyBrowserExtension HeyClicky.deps.json HeyClicky.runtimeconfig.json recovery.json docs/SOURCE_INDEX.md
          if ! git diff --cached --quiet; then
            git commit -m 'Recover unpacked C# source and app resources from verified installer'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  build:
    needs: recover
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.recover.outputs.source_sha }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare verified original dependency assemblies
        run: python scripts/recover.py --prepare-only
      - name: Build all source modules and retain diagnostics
        shell: pwsh
        run: |
          New-Item -ItemType Directory artifacts/logs -Force | Out-Null
          $failed = @()
          foreach ($module in @('HeyClicky.Contracts', 'HeyClicky.Core', 'HeyClicky.Agents', 'HeyClicky.Platform', 'HeyClicky.Drawing', 'HeyClicky.Drawing3D', 'HeyClicky')) {
            dotnet build "Source/$module/$module.csproj" -c Release -v:minimal -m:1 -nr:false 2>&1 | Tee-Object -FilePath "artifacts/logs/$module.log"
            if ($LASTEXITCODE -ne 0) { $failed += $module }
          }
          if ($failed.Count -gt 0) { throw "Source recovery remains incomplete: $($failed -join ', '). See diagnostics artifact." }
      - name: Verify stream parsing and common contracts
        shell: pwsh
        run: |
          dotnet build tests/RecoverySmoke/RecoverySmoke.csproj -c Release -m:1 -nr:false
          if ($LASTEXITCODE -ne 0) { throw 'Smoke test compilation failed.' }
          dotnet tests/RecoverySmoke/bin/Release/net9.0/RecoverySmoke.dll
          if ($LASTEXITCODE -ne 0) { throw 'Smoke tests failed.' }
      - name: Stage recovered Windows runtime
        run: ./scripts/build.ps1
      - name: Probe Windows UI process in demo mode
        shell: pwsh
        run: |
          $env:HEYCLICKY_DATA_DIR = Join-Path $env:RUNNER_TEMP 'colicky-ui-probe'
          $env:HEYCLICKY_OFFSCREEN = '1'
          New-Item -ItemType Directory -Force $env:HEYCLICKY_DATA_DIR | Out-Null
          $app = (Resolve-Path 'artifacts/runtime/HeyClicky.exe').Path
          $process = Start-Process $app -ArgumentList '--fakes','--demo-only','--e2e' -WorkingDirectory (Split-Path $app) -PassThru -RedirectStandardOutput 'artifacts/logs/ui-stdout.log' -RedirectStandardError 'artifacts/logs/ui-stderr.log'
          try {
            Start-Sleep -Seconds 12
            $process.Refresh()
            if ($process.HasExited) {
              Get-Content artifacts/logs/ui-stderr.log -ErrorAction SilentlyContinue
              throw "UI process exited during startup (code $($process.ExitCode))."
            }
            Write-Host 'PASS: rebuilt Windows demo process stayed alive for 12 seconds. This is not full UI or backend validation.'
          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
            Copy-Item "$env:HEYCLICKY_DATA_DIR/*" artifacts/logs -Recurse -Force -ErrorAction SilentlyContinue
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-build-diagnostics
          path: artifacts/logs
